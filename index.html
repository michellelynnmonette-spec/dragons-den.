<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon's Den — T-REX ROAR v4</title><style>body{margin:0;background:#283b34;color:#f5f0e4;font-family:system-ui;text-align:center;padding:18px}main{max-width:570px;margin:auto}.dragon{font-size:115px;transition:.2s}.fire .dragon{animation:shake .12s infinite alternate}.fire .flames{opacity:1}.flames{font-size:70px;opacity:0;transition:.1s}h1{font-size:30px}button{font-size:20px;font-weight:bold;padding:17px;margin:8px;border:0;border-radius:15px;background:#c68b57;color:#192b25}button:disabled{opacity:.45}section{background:#40584f;padding:20px;border-radius:20px;margin:16px 0}input{width:90%;accent-color:#e3aa61}.meter{height:24px;background:#89998d;border-radius:20px;overflow:hidden}.meter div{height:100%;width:0;background:#e4ac60;transition:width .12s}.status{font-size:24px;font-weight:bold}small{line-height:1.5}@keyframes shake{from{transform:translateX(-8px) rotate(-5deg)}to{transform:translateX(8px) rotate(5deg)}}</style><main><h1>🐉 Dragon's Den</h1><strong>🦖 T-REX ROAR • VERSION 4</strong><div class="dragon">🐲</div><div class="flames">🔥🔥🔥</div><p class="status" id="status">Dragon is sleeping 💤</p><div class="meter"><div id="meter"></div></div><section><button id="start">▶ Start Listening</button><button id="stop" disabled>■ Stop</button><p>Noise sensitivity: <b id="senslabel">Medium</b></p><input id="sens" type="range" min="1" max="100" value="50"><p>Roar volume: <b id="vollabel">100%</b></p><input id="vol" type="range" min="0" max="100" value="100"><p><button id="test">🦖 TEST T-REX ROAR</button></p></section><small>Free • No account • Audio is processed on this device; no recordings are saved. Allow microphone access when prompted. For classrooms, test the volume before students arrive.</small></main><script>
let ctx,stream,analyser,source,buf,raf,above=0,last=0,roaring=false;const $=x=>document.getElementById(x),status=$('status'),dragon=document.querySelector('main');$('vol').oninput=()=> $('vollabel').textContent=$('vol').value+'%';$('sens').oninput=()=> $('senslabel').textContent= $('sens').value<35?'Low':$('sens').value>65?'High':'Medium';
function audio(){return ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)())}function noiseBuffer(c,secs){let n=Math.floor(c.sampleRate*secs),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),v=0;for(let i=0;i<n;i++){v=.92*v+.08*(Math.random()*2-1);d[i]=v}return b}
async function roar(){if(roaring)return;roaring=true;let c=audio();await c.resume();let t=c.currentTime+.04,d=3.7,g=c.createGain(),lim=c.createDynamicsCompressor();lim.threshold.value=-16;lim.knee.value=8;lim.ratio.value=9;lim.attack.value=.004;lim.release.value=.18;g.gain.value=Number($('vol').value)/100*.85;g.connect(lim);lim.connect(c.destination);dragon.classList.add('fire');status.textContent='🔥 T-REX ROARING! 🔥';
// Multiple harsh, pitched layers designed to remain audible on phone speakers.
for(let j=0;j<5;j++){let o=c.createOscillator(),filter=c.createBiquadFilter(),env=c.createGain();o.type=j%2?'sawtooth':'triangle';let base=[95,145,205,285,410][j];o.frequency.setValueAtTime(base*.65,t);o.frequency.exponentialRampToValueAtTime(base*1.5,t+.34);o.frequency.exponentialRampToValueAtTime(base*.72,t+2.1);o.frequency.exponentialRampToValueAtTime(base*.48,t+d);filter.type='bandpass';filter.frequency.value=base*2.5;filter.Q.value=.7;env.gain.setValueAtTime(.001,t);env.gain.exponentialRampToValueAtTime(.12,t+.22);env.gain.setValueAtTime(.12,t+1.65);env.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(filter).connect(env).connect(g);o.start(t);o.stop(t+d+.03)}
let src=c.createBufferSource(),f=c.createBiquadFilter(),ng=c.createGain();src.buffer=noiseBuffer(c,d);f.type='bandpass';f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(1650,t+.5);f.frequency.exponentialRampToValueAtTime(650,t+d);f.Q.value=.5;ng.gain.setValueAtTime(.001,t);ng.gain.linearRampToValueAtTime(.75,t+.28);ng.gain.setValueAtTime(.65,t+1.6);ng.gain.linearRampToValueAtTime(.001,t+d);src.connect(f).connect(ng).connect(g);src.start(t);src.stop(t+d);setTimeout(()=>{dragon.classList.remove('fire');status.textContent=stream?'Dragon is listening 👂':'Dragon is sleeping 💤';roaring=false},3900)}$('test').onclick=roar;
$('start').onclick=async()=>{try{let c=audio();await c.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});source=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=2048;source.connect(analyser);buf=new Uint8Array(analyser.fftSize);$('start').disabled=true;$('stop').disabled=false;status.textContent='Dragon is listening 👂';tick()}catch(e){status.textContent='Microphone blocked — allow microphone permission in Chrome'}};
function tick(){if(!stream)return;analyser.getByteTimeDomainData(buf);let sum=0;for(let x of buf){let v=(x-128)/128;sum+=v*v}let rms=Math.sqrt(sum/buf.length),level=Math.min(100,rms*500);$('meter').style.width=level+'%';let threshold=52-Number($('sens').value)*.38,now=Date.now();if(level>threshold){if(!above)above=now;if(now-above>1500&&now-last>9500&&!roaring){last=now;roar();above=0}}else above=0;raf=requestAnimationFrame(tick)}$('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;cancelAnimationFrame(raf);$('start').disabled=false;$('stop').disabled=true;$('meter').style.width='0';status.textContent='Dragon is sleeping 💤'};
</script></html>
