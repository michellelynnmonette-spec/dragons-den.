<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon's Den — Classroom Bell v5</title><style>body{margin:0;background:#263b35;color:#f5ebd6;font:18px system-ui;text-align:center}main{max-width:540px;margin:auto;padding:22px}h1{margin:8px}#dragon{font-size:100px;margin:15px;transition:transform .15s}#dragon.ring{animation:shake .18s 5}@keyframes shake{50%{transform:rotate(10deg) scale(1.12)}}button{background:#d5a65c;color:#18251e;border:0;border-radius:15px;padding:15px 24px;font-size:19px;font-weight:bold;margin:7px;cursor:pointer}button.secondary{background:#a4b8aa}label{display:block;margin:22px 0 5px}input{width:85%;accent-color:#e2af60}#status{font-size:23px;font-weight:700}#meter{height:22px;background:#52665d;border-radius:20px;overflow:hidden;margin:16px}#fill{height:100%;width:0;background:#e4b46d;transition:width .1s}.note{font-size:14px;color:#d0d6c9}#version{font-size:14px;color:#d5ba89}</style></head><body><main><div id="version">CLASSROOM BELL • VERSION 5</div><h1>🐉 Dragon's Den</h1><div id="dragon">🐉🔔</div><div id="status">Ready to watch the room</div><div id="meter"><div id="fill"></div></div><button id="start">Start Listening</button><button id="test" class="secondary">🔔 Test Bell</button><label for="sensitivity">Noise threshold: <b id="thresholdLabel">55%</b></label><input id="sensitivity" type="range" min="15" max="95" value="55"><label for="volume">Bell volume: <b id="volumeLabel">75%</b></label><input id="volume" type="range" min="10" max="100" value="75"><p class="note">The bell sounds only after sustained loud noise, then waits 12 seconds before ringing again. No audio is recorded or uploaded. Chrome microphone permission required. Bell loudness is limited by device speakers.</p></main><script>let ctx,stream,analyser,source,raf,active=false,overSince=0,lastBell=0;const $=id=>document.getElementById(id),sens=$('sensitivity'),vol=$('volume');sens.oninput=()=> $('thresholdLabel').textContent=sens.value+'%';vol.oninput=()=> $('volumeLabel').textContent=vol.value+'%';function bell(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let now=ctx.currentTime,g=ctx.createGain(),level=Number(vol.value)/100;g.connect(ctx.destination);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.001,level*.45),now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+1.65);[660,990,1320,1760].forEach((f,i)=>{let o=ctx.createOscillator(),og=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*.995,now+1.5);og.gain.value=[.65,.23,.12,.08][i];o.connect(og).connect(g);o.start(now);o.stop(now+1.7)});$('dragon').classList.remove('ring');void $('dragon').offsetWidth;$('dragon').classList.add('ring');} $('test').onclick=bell;function tick(){if(!active)return;let a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let sum=0;for(let x of a){let v=(x-128)/128;sum+=v*v}let rms=Math.sqrt(sum/a.length),pct=Math.min(100,Math.round(rms*350));$('fill').style.width=pct+'%';let now=Date.now();if(pct>=Number(sens.value)){if(!overSince)overSince=now;if(now-overSince>1500&&now-lastBell>12000){bell();lastBell=now;overSince=0}$('status').textContent='Too loud — quiet the den!'}else{overSince=0;$('status').textContent='Dragon is calm 😴'}raf=requestAnimationFrame(tick)}$('start').onclick=async()=>{if(active){active=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());$('start').textContent='Start Listening';$('status').textContent='Stopped';return}try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:true});analyser=ctx.createAnalyser();analyser.fftSize=1024;source=ctx.createMediaStreamSource(stream);source.connect(analyser);active=true;overSince=0;$('start').textContent='Stop Listening';tick()}catch(e){$('status').textContent='Microphone unavailable — open the HTTPS site in Chrome and allow microphone access.'}};</script></body></html>
